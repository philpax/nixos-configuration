name: ci

on:
  push:
    paths:
      - "*.py"
      - "*.md"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
      # Target-first layout: each target dir owns Nix files (+ dotfiles/).
      - "common-all/**"
      - "common-desktop/**"
      - "common-dev/**"
      - "common-dev-desktop/**"
      - "jinroh/**"
      - "mindgame/**"
      - "paprika/**"
      - "redline/**"
  pull_request:
    paths:
      - "*.py"
      - "*.md"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
      - "common-all/**"
      - "common-desktop/**"
      - "common-dev/**"
      - "common-dev-desktop/**"
      - "jinroh/**"
      - "mindgame/**"
      - "paprika/**"
      - "redline/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check
      - run: uvx ruff format --check

  test:
    runs-on: ubuntu-latest
    steps:
      # Steel cogs are git submodules. test_sync.py now builds synthetic
      # tmp_path trees and no longer reads the real steel-cogs checkout, so
      # the tests pass without the submodules; the checkout is kept for a
      # complete working tree, not for the tests.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - run: uvx pytest -v