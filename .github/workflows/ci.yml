name: ci

on:
  push:
    paths:
      - "*.py"
      - "*.md"
      - "pyproject.toml"
      - "uv.lock"
      - "sync.sh"
      - "frame/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      # Target-first layout: each target dir owns Nix files (+ dotfiles/).
      - "common-all/**"
      - "common-desktop/**"
      - "common-dev/**"
      - "common-dev-desktop/**"
      - "jinroh/**"
      - "mindgame/**"
      - "paprika/**"
      - "patlabor/**"
      - "redline/**"
  pull_request:
    paths:
      - "*.py"
      - "*.md"
      - "pyproject.toml"
      - "uv.lock"
      - "sync.sh"
      - "frame/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - "common-all/**"
      - "common-desktop/**"
      - "common-dev/**"
      - "common-dev-desktop/**"
      - "jinroh/**"
      - "mindgame/**"
      - "paprika/**"
      - "patlabor/**"
      - "redline/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check
      - run: uv run ruff format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -v

  frame:
    # Arm64 so import-from-derivation (helix-steel's Cargo.lock) can fetch its
    # aarch64 source during evaluation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.5/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            require-sigs = true
      - name: Evaluate Frame's system-manager configuration
        run: nix-instantiate frame
