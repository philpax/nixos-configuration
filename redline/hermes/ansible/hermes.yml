---
# Provisioning for the Hermes VM. Idempotent; re-run to converge.
#
#   ansible-playbook -i /etc/hermes/inventory.ini hermes.yml
#   ansible-playbook -i /etc/hermes/inventory.ini hermes.yml --tags honcho
#
# The inventory and ansible vars are generated by the host from
# redline/hermes/net.nix (guestAddr) and ../ai/ananke.nix into
# /etc/hermes/. Run `nixos-rebuild switch` on redline before the playbook;
# there is no fallback inventory in git.
#
# Does not enrol the agent. See ../README.md.

- name: Provision the Hermes agent VM
  hosts: hermes
  become: true

  # The host renders these vars in ../default.nix; include_vars loads them.
  # The default values below only exist so a contributor running the playbook
  # against a non-rebuilt host still has every var defined; they mirror
  # ../net.nix and ../ai/ananke.nix. Keep in sync with both.

  vars:
    state_root: /srv/hermes
    drop_dir: /srv/drop
    hermes_home: /srv/hermes/hermes
    honcho_dir: /srv/hermes/honcho
    workspace: /srv/hermes/workspace
    # The agent runs as root; see cloud-init and README.
    agent_user: root

    hermes_ref: "3671c9f188e1563fd7acb6021f430e4607e17900"
    honcho_ref: "d191c107e5250cc2ca4c6058d9ebfe26b7cfc6f8"

    # lfm2.5-embedding-350m: llama.cpp-served, 1024-dim. Train limit is 512
    # tokens; Honcho embeds whole messages, so inputs above 512 tokens must
    # route to the jina embedder (ananke side) when one is available.
    embedding_model: "lfm2.5-embedding-350m"
    embedding_dimensions: 1024

    # Defaults vs the generated /etc/hermes/ansible-vars.yml.
    dashboard_port: 9119
    honcho_port: 8000
    ananke_base_url: "http://10.100.0.1:7070/v1"
    deriver_model: "gemma-4-31b-it-qat"

  pre_tasks:
    - name: Check for host-rendered vars file
      ansible.builtin.stat:
        path: /etc/hermes/ansible-vars.yml
      register: hermes_vars_file

    - name: Load host-rendered vars when present
      ansible.builtin.include_vars:
        file: /etc/hermes/ansible-vars.yml
      when: hermes_vars_file.stat.exists

  tasks:
    # ── Base ──────────────────────────────────────────────────────────────
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - zstd
          - jq
          - ripgrep
          - ffmpeg
          - python3-venv
          - python3-pip
          - docker.io
          - docker-compose-v2
          - ca-certificates
          - gnupg
        state: present
        update_cache: true
      tags: [base]

    - name: Add the agent user to the docker group
      ansible.builtin.user:
        name: "{{ agent_user }}"
        groups: docker
        append: true
      tags: [base]

    - name: Ensure the state layout exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ agent_user }}"
        group: "{{ agent_user }}"
        mode: "0755"
      loop:
        - "{{ state_root }}"
        - "{{ hermes_home }}"
        - "{{ honcho_dir }}"
        - "{{ workspace }}"
      tags: [base]

    - name: Enable docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      tags: [base]

    # A guest converted from a named user to root (or vice versa) leaves git
    # repos owned by the other uid; git then refuses to touch them. Rewrite the
    # safe.directory section each run to stay idempotent.
    - name: Mark the state-disk git repos as safe for the agent user
      ansible.builtin.shell:
        cmd: |
          git config --global --remove-section safe >/dev/null 2>&1 || true
          git config --global --add safe.directory /srv/hermes/honcho/src
          git config --global --add safe.directory /srv/hermes/hermes-agent
      become_user: "{{ agent_user }}"
      changed_when: false
      tags: [base]

    # cloud-init cannot mount this: cc_mounts discards any device that is
    # neither a block device nor a host:/export spec.
    - name: Mount the host backup drop over virtiofs
      ansible.posix.mount:
        src: hermes-drop
        path: "{{ drop_dir }}"
        fstype: virtiofs
        opts: defaults,nofail
        state: mounted
      tags: [base]

    - name: Verify the drop is actually mounted
      ansible.builtin.command:
        cmd: mountpoint -q {{ drop_dir }}
      changed_when: false
      tags: [base]

    # ── Honcho ────────────────────────────────────────────────────────────
    # hex keeps the value safe in a postgresql:// URI, where `/` terminates
    # the authority and `+` may decode as a space.
    - name: Generate the Honcho database password once
      ansible.builtin.shell:
        cmd: "umask 077 && openssl rand -hex 24 | tr -d '\\n' > {{ honcho_dir }}/.pgpass"
        creates: "{{ honcho_dir }}/.pgpass"
      tags: [honcho]

    - name: Read the database password
      ansible.builtin.slurp:
        src: "{{ honcho_dir }}/.pgpass"
      register: pgpass_file
      tags: [honcho]

    - name: Expose the database password to the templates
      ansible.builtin.set_fact:
        pg_password: "{{ pgpass_file.content | b64decode | trim }}"
      no_log: true
      tags: [honcho]

    - name: Clone Honcho
      ansible.builtin.git:
        repo: https://github.com/plastic-labs/honcho
        dest: "{{ honcho_dir }}/src"
        version: "{{ honcho_ref }}"
      become_user: "{{ agent_user }}"
      tags: [honcho]

    # When honcho_ref is bumped, diff upstream's docker-compose.yml.example
    # against this template.
    - name: Template the Honcho compose file
      ansible.builtin.template:
        src: honcho-compose.yml.j2
        dest: "{{ honcho_dir }}/src/docker-compose.yml"
        owner: "{{ agent_user }}"
        mode: "0640"
      notify: restart honcho
      tags: [honcho]

    # The container's api/deriver run as uid 100 (app) and bind-mount these
    # files, so they must be world-readable. .env holds no secret (only the
    # ananke URL and a local dummy key); the DB password is a separate volume.
    - name: Template the Honcho environment
      ansible.builtin.template:
        src: honcho.env.j2
        dest: "{{ honcho_dir }}/src/.env"
        mode: "0644"
      notify: restart honcho
      tags: [honcho]

    - name: Template the Honcho config
      ansible.builtin.template:
        src: honcho-config.toml.j2
        dest: "{{ honcho_dir }}/src/config.toml"
        mode: "0644"
      notify: restart honcho
      tags: [honcho]

    - name: Bring Honcho up
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ honcho_dir }}/src"
      register: honcho_up
      changed_when: "'Started' in honcho_up.stderr or 'Created' in honcho_up.stderr"
      tags: [honcho]

    # ── Hermes ────────────────────────────────────────────────────────────
    # force: the dashboard's frontend build runs `npm install` at the workspace
    # root, which rewrites the tracked package-lock.json; without force the
    # clone fails with "Local modifications exist". venv and web_dist are
    # gitignored, and HERMES_HOME is outside the checkout.
    - name: Clone Hermes Agent
      ansible.builtin.git:
        repo: https://github.com/NousResearch/hermes-agent
        dest: "{{ state_root }}/hermes-agent"
        version: "{{ hermes_ref }}"
        force: true
      become_user: "{{ agent_user }}"
      tags: [hermes]

    # scripts/install.sh is upstream's installer, run from the pinned checkout
    # so the version stays pinned. --skip-setup suppresses the interactive
    # enrolment wizard, which is done by hand later; without it the run blocks
    # on a `read` indefinitely.
    #
    # --dir and --hermes-home default under ~ (the disposable OS disk); both
    # must land on the state disk. A venv-directory test is not enough:
    # install.sh's uv-managed interpreter defaults under ~/.local/share/uv,
    # which an OS-disk rebuild removes while leaving the venv behind. Testing
    # the interpreter catches that and reinstalls.
    - name: Check whether the existing venv is usable
      ansible.builtin.command:
        cmd: "{{ state_root }}/hermes-agent/venv/bin/python -c 'import sys'"
      register: venv_probe
      changed_when: false
      failed_when: false
      tags: [hermes]

    # UV_PYTHON_INSTALL_DIR keeps the interpreter on the state disk alongside
    # the venv that references it.
    - name: Install Hermes
      ansible.builtin.command:
        cmd: >-
          ./scripts/install.sh --skip-setup
          --dir {{ state_root }}/hermes-agent
          --hermes-home {{ hermes_home }}
        chdir: "{{ state_root }}/hermes-agent"
      environment:
        UV_PYTHON_INSTALL_DIR: "{{ state_root }}/uv-python"
      when: venv_probe.rc != 0
      become_user: "{{ agent_user }}"
      notify: restart hermes
      tags: [hermes]

    # The dashboard's auth gate engages on any non-loopback bind, and start_server
    # fails closed without a registered provider, so the credentials are
    # mandatory rather than optional hardening.
    - name: Generate the dashboard password once
      ansible.builtin.shell:
        cmd: "umask 077 && openssl rand -hex 24 | tr -d '\\n' > {{ state_root }}/.dashboard-pass"
        creates: "{{ state_root }}/.dashboard-pass"
      tags: [hermes]

    - name: Read the dashboard password
      ansible.builtin.slurp:
        src: "{{ state_root }}/.dashboard-pass"
      register: dashboard_pass_file
      tags: [hermes]

    - name: Expose the dashboard password to the templates
      ansible.builtin.set_fact:
        dashboard_password: "{{ dashboard_pass_file.content | b64decode | trim }}"
      no_log: true
      tags: [hermes]

    # config.yaml, memory and skills live under HERMES_HOME, on the state disk.
    - name: Set HERMES_HOME globally
      ansible.builtin.copy:
        dest: /etc/profile.d/hermes.sh
        content: |
          export HERMES_HOME={{ hermes_home }}
        mode: "0644"
      tags: [hermes]

    # The dashboard builds its own frontend on first start, but only when npm
    # is present; otherwise it exits with "Web UI frontend not built". Ubuntu
    # 24.04 ships Node 18.19 and the build needs Node 20 or newer.
    - name: Add the NodeSource signing key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: "0644"
      tags: [hermes]

    - name: Add the NodeSource repository
      ansible.builtin.deb822_repository:
        name: nodesource
        types: [deb]
        uris: https://deb.nodesource.com/node_22.x
        suites: [nodistro]
        components: [main]
        signed_by: /etc/apt/keyrings/nodesource.asc
        state: present
      tags: [hermes]

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true
      tags: [hermes]

    - name: Install the Hermes service units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - hermes-gateway.service
        - hermes-dashboard.service
      notify: restart hermes
      tags: [hermes]

    # The agent runs as root, so this sudoers drop-in is a documented no-op kept
    # so a downgrade back to a named user regains the gateway grant.
    - name: Allow the agent user to manage the gateway without a password
      ansible.builtin.copy:
        dest: /etc/sudoers.d/hermes-hermes-gateway
        content: |
          # Managed by ansible. Edit ../hermes.yml, not this file.
          #
          # Runs as root; agent = root in this VM. Kept as a documented no-op so
          # downgrades back to a named user get this grant back.
          root ALL=(ALL) NOPASSWD:ALL
        validate: "/usr/sbin/visudo -cf %s"
        mode: "0440"
      tags: [hermes]

    - name: Enable and start the Hermes units
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - hermes-gateway.service
        - hermes-dashboard.service
      tags: [hermes]

    # ── Signal (messaging channel) ────────────────────────────────────────
    # The gateway streams Signal through signal-cli's HTTP daemon on
    # 127.0.0.1:8080. The account number is a secret, stored once at
    # /srv/hermes/.signal-account (0600, state disk); the daemon unit reads it
    # at exec time, so it never appears in this repo. Linking is one-time by
    # hand: `signal-cli -d /srv/hermes/signal-cli-data link -n Berigora`.
    - name: Install OpenJDK 25 (signal-cli 0.14.x requires class file 69)
      ansible.builtin.apt:
        name: openjdk-25-jre-headless
        state: present
        update_cache: true
      tags: [signal]

    - name: Check signal-cli version
      ansible.builtin.command:
        cmd: /usr/local/bin/signal-cli --version
      register: signal_cli_version
      changed_when: false
      failed_when: false
      tags: [signal]

    - name: Install signal-cli v0.14.7 into /opt
      ansible.builtin.unarchive:
        src: https://github.com/AsamK/signal-cli/releases/download/v0.14.7/signal-cli-0.14.7.tar.gz
        dest: /opt
        remote_src: true
        creates: /opt/signal-cli-0.14.7
      when: signal_cli_version.rc != 0 or "0.14.7" not in (signal_cli_version.stdout | default(""))
      tags: [signal]

    - name: Symlink signal-cli into /usr/local/bin
      ansible.builtin.file:
        src: /opt/signal-cli-0.14.7/bin/signal-cli
        dest: /usr/local/bin/signal-cli
        state: link
        force: true
      tags: [signal]

    - name: Install the signal-cli daemon unit
      ansible.builtin.template:
        src: signal-cli-daemon.service.j2
        dest: /etc/systemd/system/signal-cli-daemon.service
        mode: "0644"
      notify: reload systemd
      tags: [signal]

    # The daemon cannot run until the phone has completed device linking.
    # listAccounts exits 0 even with no account, so gate on non-empty output.
    - name: Check whether the Signal account is linked
      ansible.builtin.command:
        cmd: /usr/local/bin/signal-cli -d /srv/hermes/signal-cli-data listAccounts
      register: signal_linked
      changed_when: false
      failed_when: false
      tags: [signal]

    - name: Enable the signal-cli daemon
      ansible.builtin.systemd:
        name: signal-cli-daemon.service
        enabled: true
        state: started
        daemon_reload: true
      when: signal_linked.stdout | trim | length > 0
      tags: [signal]

    # ── Backup ────────────────────────────────────────────────────────────

    - name: Install the backup script
      ansible.builtin.template:
        src: hermes-backup.sh.j2
        dest: /usr/local/bin/hermes-backup
        mode: "0755"
      tags: [backup]

    - name: Install the backup units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - hermes-backup.service
        - hermes-backup.timer
      notify: reload systemd
      tags: [backup]

    - name: Enable the backup timer
      ansible.builtin.systemd:
        name: hermes-backup.timer
        enabled: true
        state: started
        daemon_reload: true
      tags: [backup]

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    # config.toml is a bind-mounted file, so its contents are not part of the
    # container spec and `up -d` alone sees nothing to change.
    - name: restart honcho
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate api deriver
        chdir: "{{ honcho_dir }}/src"

    - name: restart hermes
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        daemon_reload: true
      loop:
        - hermes-gateway.service
        - hermes-dashboard.service
