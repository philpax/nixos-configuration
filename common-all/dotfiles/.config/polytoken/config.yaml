version: 3
config_command_substitution: true
defaults:
  full: codex/gpt-6.1-sol(xhigh)
  mini: codex/gpt-6-luna(xhigh)
  nano: codex/gpt-6-luna(low)
providers:
  umans:
    kind:
      type: catalog
      name: umans
    auth:
      type: static_key
      key: $(cat ~/.tokens/umans-token)
  ananke-mindgame:
    kind:
      type: custom_open_ai_compatible
    url: http://mindgame:7070/v1
    auth:
      type: no_auth
  ananke-redline:
    kind:
      type: custom_open_ai_compatible
    url: http://redline:7070/v1
    auth:
      type: no_auth
  codex:
    kind:
      type: catalog
      name: codex
    auth:
      type: codex_device
      profile: codex
  synthetic:
    kind:
      type: custom_open_ai_compatible
    url: https://api.synthetic.new/openai/v1
    auth:
      type: static_key
      key: $(cat ~/.tokens/synthetic-token)
      format: bearer_token
    protocol: openai_chat_completions
  ocgo-c:
    kind:
      type: catalog
      name: ocgo-c
    auth:
      type: static_key
      key: $(cat ~/.tokens/opencode-go-token)
