version: 3
config_command_substitution: true
defaults:
  full: ananke-mindgame/qwen3.6-27b-ninfer-mtp3
  mini: ananke-mindgame/qwen3.6-27b-ninfer-mtp3
  nano: ananke-mindgame/qwen3.6-35b-a3b-ninfer-dflash7
providers:
  umans:
    kind:
      type: catalog
      name: umans
    auth:
      type: static_key
      key: $(cat ~/.tokens/umans-token)
  ananke-mindgame:
    kind:
      type: custom_open_ai_compatible
    url: http://mindgame:7070/v1
    auth:
      type: no_auth
  ananke-redline:
    kind:
      type: custom_open_ai_compatible
    url: http://redline:7070/v1
    auth:
      type: no_auth
  codex:
    kind:
      type: catalog
      name: codex
    auth:
      type: codex_device
      profile: codex
  synthetic:
    kind:
      type: custom_open_ai_compatible
    url: https://api.synthetic.new/openai/v1
    auth:
      type: static_key
      key: $(cat ~/.tokens/synthetic-token)
      format: bearer_token
    protocol: openai_chat_completions
models:
  ananke-mindgame/qwen3.6-27b-ninfer-mtp3:
    provider_name: qwen3.6-27b-ninfer-mtp3
    variant: other
    class: mini
    provider: ananke-mindgame
    reasoning:
      type: thinking
      can_disable: true
    context_window: 196608
    max_output_tokens_per_turn: 32768
    supports_vision: false
